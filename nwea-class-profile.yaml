name: nwea-asg-and-class-profile
description: >
  Log in to NWEA once, download the Achievement Status and Growth (ASG) report for every
  Growth Comparison Period the school tests, then the Class Profile CSV for every teacher,
  subject and course that has scored students. All CSVs for the term go in one flat folder.
  Files already downloaded are skipped, so a run can be repeated safely. See FLOW.md.

# Run:  ./run.sh                      (term from NWEA_TERM in .env)
#       ./run.sh "Spring 2025-2026"   (or pick a term for this run)
params:
  term: { required: true, env: NWEA_TERM, describe: 'season + academic year as NWEA shows it, e.g. "Fall 2026-2027"' }
  testedSeasons: [Fall, Spring]   # this school tests twice a year; add Winter/Summer if the school does
  downloadDir: downloads/nwea

# Username and password come from .env, or from user=... pass=... on the command line.
secrets:
  NWEA_USER: { arg: user }
  NWEA_PASS: { arg: pass }

# Optional pop-ups, clicked whenever they show up (before each step and while waiting).
dismiss:
  - { css: '[data-test-id="announcement-btn"]' }   # "System Alert" maintenance notice

locators:
  # Class Profile (reports.mapnwea.org/profile/class/test-details)
  termTested:   &termTested   { css: '[role="combobox"][aria-labelledby*="term-tested-label"]' }
  termRostered: &termRostered { css: '[role="combobox"][aria-labelledby*="term-rostered-label"]' }
  openPanel:    &openPanel    { testid: change-selection-button }
  cancel:       &cancel       { testid: cancel-button }
  ritStatus:    &ritStatus    { regex: '\d+ out of \d+ students? ha(s|ve) an official RIT score' }
  # ASG (teach.mapnwea.org/report/map/asgClassReport.seam)
  createSpreadsheet: &createSpreadsheet
    any:
      - { role: button, name: Create Spreadsheet }
      - { text: Create Spreadsheet, exact: true }
  periodRadios: &periodRadios { css: 'input[type="radio"][name$=":growthComparisonPeriod"]' }

# After a Class Profile course fails: reload the page and carry on with the next course.
recover:
  - goto: https://reports.mapnwea.org/profile/class/test-details
  - waitFor: *openPanel

steps:
  # 0. Check the inputs before opening anything.
  - checkTerm: { term: "${term}", seasons: "${testedSeasons}" }

  # A. Log in. NWEA redirects /map to auth.nwea.org; the System Alert is handled by "dismiss:".
  - goto: https://reports.mapnwea.org/map
  - waitFor: { css: '[data-test-id="input-field-login-email"]', timeout: 90000 }
  - fill:  { css: '[data-test-id="input-field-login-email"]', secret: NWEA_USER }
  - click: { css: '[data-test-id="continue-btn"]' }
  - waitFor: { css: '[data-test-id="password-input-field-root"] input[type="password"]' }
  - fill:  { css: '[data-test-id="password-input-field-root"] input[type="password"]', secret: NWEA_PASS }
  - click: { css: '[data-test-id="login-btn"]' }
  - waitFor: { role: link, name: "Class Profile report details", timeout: 60000 }

  # Empty the Reports Queue before requesting any report, so an old report can never be
  # taken for a new one. Reports that will not go are logged and ignored.
  - goto: https://reports.mapnwea.org/queue
  - waitFor: { text: Remove Selected, exact: true, timeout: 60000 }
  - nweaQueueClear: {}

  # B. ASG report: one CSV per Growth Comparison Period whose seasons are all tested.
  #    Each report is built in the Reports Queue, downloaded, then removed from the queue.
  - forEach:
      as: period
      radiosOf: *periodRadios
      onlySeasons: "${testedSeasons}"
      onError: continue
      recover: []                     # "before" reloads the ASG page anyway
      before:
        - goto: https://teach.mapnwea.org/report/map/asgClassReport.seam
        - waitFor: { css: 'input[type="radio"][name$=":growthComparisonPeriod"]', timeout: 60000 }
        - setAllSelects: { optionMatches: '^(Fall|Winter|Spring|Summer) \d{4}-\d{4}', option: "${term}", min: 2 }
      do:
        - waitForIdle:
        - skipIfExists: { file: "${downloadDir}/${term}/ASG - ${period}.csv" }
        - click: *createSpreadsheet
        - waitForUrl: { url: "**/queue**", timeout: 300000 }
        - nweaQueueDownload:
            report: Achievement Status and Growth
            saveAs: "${downloadDir}/${term}/ASG - ${period}.csv"
            timeout: 900000           # wait up to 15 min for "Ready to View"

  # C. Class Profile: every teacher -> subject -> course, only when students have RIT scores.
  #    Term Tested and Term Rostered are both set to the input term.
  - goto: https://reports.mapnwea.org/profile/class/test-details
  - waitFor: { testid: change-selection-button, timeout: 60000 }
  - forEach:
      as: teacher
      onError: continue
      before:
        - click:  *openPanel
        - choose: { in: *termTested,   option: "${term}" }
        - choose: { in: *termRostered, option: "${term}" }
      optionsOf: { field: Instructor }
      close:
        - click: *cancel
      do:
        - click: *cancel

        - forEach:
            as: subject
            onError: continue
            before:
              - click:  *openPanel
              - choose: { in: *termTested,   option: "${term}" }
              - choose: { in: *termRostered, option: "${term}" }
              - choose: { in: { field: Instructor }, option: "${teacher}" }
            optionsOf: { field: Subject }
            close:
              - click: *cancel
            do:
              - click: *cancel

              - forEach:
                  as: course
                  onError: continue
                  before:
                    - click:  *openPanel
                    - choose: { in: *termTested,   option: "${term}" }
                    - choose: { in: *termRostered, option: "${term}" }
                    - choose: { in: { field: Instructor }, option: "${teacher}" }
                    - choose: { in: { field: Subject },    option: "${subject}" }
                  optionsOf: { field: Course }
                  close:
                    - click: *cancel
                  do:
                    - skipIfExists:
                        file: "${downloadDir}/${term}/${teacher} - ${subject} - ${course}.csv"
                        cleanup:
                          - click: *cancel
                    - clickIfEnabled:
                        target:    { role: button, name: Update }
                        otherwise: *cancel
                    - waitForIdle:
                    # The report subtitle ends with the course ("Homeroom 9A | Grade 9 | ... | Algebra 1").
                    # Seeing it proves the page shows this course, not the previous one.
                    - waitFor: { endsWith: "| ${course}", timeout: 15000, optional: true }
                    - skipIfText:
                        target: *ritStatus
                        matches: '^0 out of'
                        reason: no scored students
                    - waitFor: { testid: downloadCSVButton }
                    - download:
                        click:  { testid: downloadCSVButton }
                        saveAs: "${downloadDir}/${term}/${teacher} - ${subject} - ${course}.csv"
